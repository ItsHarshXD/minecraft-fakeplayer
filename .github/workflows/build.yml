name: Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nms:
    name: NMS dependencies (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: legacy
            java: "17"
            versions: "1.20.1 1.20.2 1.20.4"
          - group: modern
            java: "21"
            versions: "1.20.6 1.21 1.21.1 1.21.3 1.21.4 1.21.5 1.21.6 1.21.7 1.21.8 1.21.10 1.21.11"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Restore remapped NMS cache
        id: nms-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/spigotmc
          key: nms-${{ runner.os }}-${{ matrix.group }}-${{ matrix.versions }}

      - name: Install remapped NMS dependencies
        if: steps.nms-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          MINECRAFT_VERSIONS: ${{ matrix.versions }}
        run: |
          set -euo pipefail
          buildtools_dir="${RUNNER_TEMP}/buildtools"
          mkdir -p "${buildtools_dir}"
          curl --fail --silent --show-error --location \
            --output "${buildtools_dir}/BuildTools.jar" \
            "https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar"

          cd "${buildtools_dir}"
          for minecraft_version in ${MINECRAFT_VERSIONS}; do
            java -jar BuildTools.jar \
              --rev "${minecraft_version}" \
              --remapped \
              --compile SPIGOT \
              --nogui
          done

      - name: Export remapped NMS repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nms-repository
          cp -R "${HOME}/.m2/repository/org/spigotmc/." nms-repository/

      - name: Upload remapped NMS repository
        uses: actions/upload-artifact@v4
        with:
          name: nms-${{ matrix.group }}
          path: nms-repository
          if-no-files-found: error
          retention-days: 1

  build:
    name: Package plugin
    needs: nms
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Minecraft 26.x adapters compile against these Paper builds (<minecraft version>@<paper build>)
      PAPER_BUILDS: "26.1.2@74 26.2@134 26.3@193"

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Download remapped NMS repositories
        uses: actions/download-artifact@v4
        with:
          pattern: nms-*
          path: ${{ runner.temp }}/nms-repository
          merge-multiple: true

      - name: Install remapped NMS repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.m2/repository/org/spigotmc"
          cp -R "${RUNNER_TEMP}/nms-repository/." "${HOME}/.m2/repository/org/spigotmc/"

      - name: Restore Paper servers cache
        id: paper-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/io/papermc/paper/paper-server-bundle
          key: paper-${{ runner.os }}-${{ env.PAPER_BUILDS }}

      - name: Install Paper servers
        if: steps.paper-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for paper_build in ${PAPER_BUILDS}; do
            scripts/install-paper-server.sh "${paper_build%%@*}" "${paper_build##*@}"
          done

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: fakeplayer
          path: target/fakeplayer-*.jar
          if-no-files-found: error
